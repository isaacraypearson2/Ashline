; Enhanced Input assets are authored in editor under /Game/Ashline/Input.
; C++ binds: Move, Look, Jump, Fire, Aim, Reload, CameraToggle, SwapWeapon, Crouch.
; Keyboard defaults intended when creating IMC_Ashline_KBM:
;   WASD move, Mouse look, LMB fire, RMB aim, R reload, Space jump, C crouch,
;   V camera FPS/TPS, 1/2 or Q swap, Esc pause.
; DualSense / extended gamepad: left stick move, right stick look, R2 fire,
;   L2 aim, Square/X reload, Cross/A jump, Circle/B crouch, Touch pad camera toggle.
; iOS: IMC_Ashline_Touch + UAshlineTouchHUD virtual stick / fire / aim / camera.
