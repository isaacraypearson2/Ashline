[ScalabilitySettings]
PerfIndexValues_ResolutionQuality="50,70,85,100,100"

; Low
[AntiAliasingQuality@0]
r.AntiAliasingMethod=2
r.TemporalAA.Upsampling=0

[ViewDistanceQuality@0]
r.ViewDistanceScale=0.6
r.SkeletalMeshLODBias=1

[ShadowQuality@0]
r.ShadowQuality=2
r.Shadow.Virtual.Enable=1

[GlobalIlluminationQuality@0]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.DiffuseIndirect.Allow=1

[ReflectionQuality@0]
r.ReflectionMethod=1

[PostProcessQuality@0]
r.BloomQuality=2
r.MotionBlurQuality=0

[TextureQuality@0]
r.MaxAnisotropy=4
r.Streaming.PoolSize=1400

[EffectsQuality@0]
r.EmitterSpawnRateCountScale=0.5

[FoliageQuality@0]
foliage.DensityScale=0.4

; Epic / Cinematic — also used as the Scalability base for Ashline_PC_* presets.
[AntiAliasingQuality@3]
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=1
r.TSR.History.ScreenPercentage=100

[ViewDistanceQuality@3]
r.ViewDistanceScale=1.15
r.SkeletalMeshLODBias=0

[ShadowQuality@3]
r.ShadowQuality=5
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.MaxQuality=3
r.Shadow.DistanceScale=1.1

[GlobalIlluminationQuality@3]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.Reflections.Allow=1
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32

[ReflectionQuality@3]
r.ReflectionMethod=1
r.Lumen.Reflections.DownsampleFactor=1

[PostProcessQuality@3]
r.BloomQuality=5
r.AmbientOcclusionLevels=2
r.MotionBlurQuality=0
r.DepthOfFieldQuality=2

[TextureQuality@3]
r.MaxAnisotropy=16
r.Streaming.PoolSize=5600
r.Streaming.LimitPoolSizeToVRAM=1

[EffectsQuality@3]
r.EmitterSpawnRateCountScale=1.0

[FoliageQuality@3]
foliage.DensityScale=1.0

; Named machine presets are applied at runtime by UAshlineGraphicsSettings:
;   Ashline_PC_Ultra    — 1440p, FSR3 Quality / TSR 85, HW RT, pool 5600
;   Ashline_PC_Balanced — 1440p, FSR3 Balanced / TSR 70, cheaper Lumen, pool 3800
;   Ashline_SteamDeck   — 1280x800, 60 fps, RT off, pool 1800
; Console: AshPCUltra / AshPCBalanced / AshDeck / AshFSR / AshTSR
; Named DeviceProfile INI rows live in PR #8. CVars: Docs/GRAPHICS.md
