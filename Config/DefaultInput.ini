; Runtime path: UAshlineRuntimeInput creates IA_* + IMC_* in memory on Play.
; Hand-authored assets under /Game/Ashline/Input/ are optional overrides.
; C++ binds: Move, Look, Jump, Fire, Aim, Reload, CameraToggle, SwapWeapon, Crouch, Sprint.
; Keyboard: WASD move, Mouse look, LMB fire, RMB aim, R reload, Space jump, C crouch,
;   Left Shift sprint, V camera FPS/TPS, 1/2 or Q swap, Esc pause / campaign, Enter confirm.
; Gamepad / Steam Deck / DualSense: left stick move, right stick look (radial deadzone),
;   RT fire, LT aim, A/Cross jump, B/Circle crouch, X/Square reload, Y/Triangle swap,
;   LS click sprint, LB swap, Start/Options pause, Select/Share + D-pad up camera,
;   A confirm / D-pad navigate campaign. Trackpads stay mouse via Steam Input.
; iOS: IMC_Ashline_Touch + UAshlineTouchHUD virtual stick / fire / aim / camera.
; Shipping: cheat execs are no-ops. Console key remains for Development / Test.
