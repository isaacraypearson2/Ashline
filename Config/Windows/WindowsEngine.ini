; Ashline — Windows-first runtime (Isaac's PC: 7500X3D / 32 GB / RX 9070 GRE).
; Overrides DefaultEngine.ini when cooking or running Win64.

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
+D3D12TargetedShaderFormats=PCD3D_SM5
Compiler=Default
bUseD3D12RHI=True

[/Script/Engine.RendererSettings]
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
r.AllowStaticLighting=False
r.DefaultFeature.AntiAliasing=4
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=1
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.Lumen.Reflections.HardwareRayTracing=True
r.DefaultFeature.MotionBlur=False

[SystemSettings]
r.VSync=0
t.MaxFPS=0
r.FinishCurrentFrame=0
r.Tonemapper.Sharpen=0.45
r.MaxAnisotropy=16
r.Streaming.PoolSize=5600
r.Streaming.LimitPoolSizeToVRAM=1
r.ScreenPercentage=77
r.ViewDistanceScale=1.1
r.Shadow.DistanceScale=1.1
r.Shadow.Virtual.MaxQuality=3
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32
r.BloomQuality=5
r.AmbientOcclusionLevels=2
r.MotionBlurQuality=0

r.SkinCache.CompileShaders=1
r.SkinCache.Mode=1

; FSR 3 — applied if the AMD plugin is enabled. Harmless no-ops when CVars are missing.
; QualityMode 1 = Quality (~1.5x / 77% Ultra Quality-ish depending on plugin version).
r.FidelityFX.FSR3.Enabled=1
r.FidelityFX.FSR3.QualityMode=1
r.FidelityFX.FI.Enabled=0

; DLSS stays off unless the NVIDIA plugin is present and the user opts in.
r.NGX.DLSS.Enable=0

; Runtime still capability-gates HW RT via UAshlineGraphicsSettings (GRHISupportsRayTracing).
; Default named preset on Windows: Ashline_PC_Ultra (auto-detect can pick Deck/Laptop/Perf).
; Console: AshPCUltra / AshPCHigh / AshPCBalanced / AshPCPerf / AshSteamDeck / AshLaptop / AshGfxAuto / AshGfxCycle
