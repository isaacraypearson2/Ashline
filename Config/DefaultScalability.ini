[ScalabilitySettings]
PerfIndexValues_ResolutionQuality="50,67,77,85,100"

; Named Ashline mapping (applied in UAshlineGraphicsSettings, not only sg.*):
;   SteamDeck / PC_Perf → group 0–1 + handheld CVars
;   High (generic)      → group 2
;   PC_Balanced         → group 2–3 + cheaper Lumen / FSR Balanced
;   PC_High             → group 3, no RT shadows
;   PC_Ultra / Epic     → group 3 + Ultra CVars
;   Cinematic           → group 4

; --- Low / Perf / Deck base ---
[AntiAliasingQuality@0]
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=1
r.TSR.History.ScreenPercentage=80

[ViewDistanceQuality@0]
r.ViewDistanceScale=0.6
r.SkeletalMeshLODBias=2

[ShadowQuality@0]
r.ShadowQuality=2
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.MaxQuality=1
r.Shadow.DistanceScale=0.7

[GlobalIlluminationQuality@0]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=8
r.Lumen.ScreenProbeGather.DownsampleFactor=32

[ReflectionQuality@0]
r.ReflectionMethod=1
r.Lumen.Reflections.DownsampleFactor=2

[PostProcessQuality@0]
r.BloomQuality=2
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.AmbientOcclusionLevels=1

[TextureQuality@0]
r.MaxAnisotropy=4
r.Streaming.PoolSize=1400
r.Streaming.LimitPoolSizeToVRAM=1

[EffectsQuality@0]
r.EmitterSpawnRateCountScale=0.45

[FoliageQuality@0]
foliage.DensityScale=0.35

[ShadingQuality@0]
r.Nanite=1

; --- Medium / High-laptop ---
[AntiAliasingQuality@1]
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=1
r.TSR.History.ScreenPercentage=90

[ViewDistanceQuality@1]
r.ViewDistanceScale=0.75
r.SkeletalMeshLODBias=1

[ShadowQuality@1]
r.ShadowQuality=3
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.MaxQuality=1
r.Shadow.DistanceScale=0.8

[GlobalIlluminationQuality@1]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.Reflections.Allow=1
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=8
r.Lumen.ScreenProbeGather.DownsampleFactor=32

[ReflectionQuality@1]
r.ReflectionMethod=1
r.Lumen.Reflections.DownsampleFactor=2

[PostProcessQuality@1]
r.BloomQuality=3
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.AmbientOcclusionLevels=1

[TextureQuality@1]
r.MaxAnisotropy=8
r.Streaming.PoolSize=2200
r.Streaming.LimitPoolSizeToVRAM=1

[EffectsQuality@1]
r.EmitterSpawnRateCountScale=0.65

[FoliageQuality@1]
foliage.DensityScale=0.5

[ShadingQuality@1]
r.Nanite=1

; --- High (generic / 1080p desktop) ---
[AntiAliasingQuality@2]
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=1
r.TSR.History.ScreenPercentage=100

[ViewDistanceQuality@2]
r.ViewDistanceScale=0.9
r.SkeletalMeshLODBias=0

[ShadowQuality@2]
r.ShadowQuality=4
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.MaxQuality=2
r.Shadow.DistanceScale=0.9

[GlobalIlluminationQuality@2]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.Reflections.Allow=1
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16
r.Lumen.ScreenProbeGather.DownsampleFactor=16

[ReflectionQuality@2]
r.ReflectionMethod=1
r.Lumen.Reflections.DownsampleFactor=1

[PostProcessQuality@2]
r.BloomQuality=4
r.MotionBlurQuality=0
r.DepthOfFieldQuality=1
r.AmbientOcclusionLevels=1

[TextureQuality@2]
r.MaxAnisotropy=12
r.Streaming.PoolSize=3200
r.Streaming.LimitPoolSizeToVRAM=1

[EffectsQuality@2]
r.EmitterSpawnRateCountScale=0.85

[FoliageQuality@2]
foliage.DensityScale=0.75

[ShadingQuality@2]
r.Nanite=1

; --- Epic / Cinematic base + Ashline_PC_Ultra/High ---
[AntiAliasingQuality@3]
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=1
r.TSR.History.ScreenPercentage=100

[ViewDistanceQuality@3]
r.ViewDistanceScale=1.15
r.SkeletalMeshLODBias=0

[ShadowQuality@3]
r.ShadowQuality=5
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.MaxQuality=3
r.Shadow.DistanceScale=1.1

[GlobalIlluminationQuality@3]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.Reflections.Allow=1
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32

[ReflectionQuality@3]
r.ReflectionMethod=1
r.Lumen.Reflections.DownsampleFactor=1

[PostProcessQuality@3]
r.BloomQuality=5
r.AmbientOcclusionLevels=2
r.MotionBlurQuality=0
r.DepthOfFieldQuality=2

[TextureQuality@3]
r.MaxAnisotropy=16
r.Streaming.PoolSize=5600
r.Streaming.LimitPoolSizeToVRAM=1

[EffectsQuality@3]
r.EmitterSpawnRateCountScale=1.0

[FoliageQuality@3]
foliage.DensityScale=1.0

[ShadingQuality@3]
r.Nanite=1

; --- Cinematic (capture / trailer, not a play preset) ---
[AntiAliasingQuality@4]
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=1
r.TSR.History.ScreenPercentage=100

[ViewDistanceQuality@4]
r.ViewDistanceScale=1.25
r.SkeletalMeshLODBias=-1

[ShadowQuality@4]
r.ShadowQuality=5
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.MaxQuality=3
r.Shadow.DistanceScale=1.2

[GlobalIlluminationQuality@4]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.Reflections.Allow=1
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32

[ReflectionQuality@4]
r.ReflectionMethod=1
r.Lumen.Reflections.DownsampleFactor=1

[PostProcessQuality@4]
r.BloomQuality=5
r.AmbientOcclusionLevels=3
r.MotionBlurQuality=0
r.DepthOfFieldQuality=3

[TextureQuality@4]
r.MaxAnisotropy=16
r.Streaming.PoolSize=6400
r.Streaming.LimitPoolSizeToVRAM=1

[EffectsQuality@4]
r.EmitterSpawnRateCountScale=1.15

[FoliageQuality@4]
foliage.DensityScale=1.15

[ShadingQuality@4]
r.Nanite=1

; Named machine presets are applied at runtime by UAshlineGraphicsSettings:
;   Ashline_PC_Ultra    — 1440p, FSR3 Quality / TSR 85, HW RT, pool 5600
;   Ashline_PC_High     — 1440p, FSR3 Quality / TSR 80, no RT shadows
;   Ashline_PC_Balanced — 1440p, FSR3 Balanced / TSR 70, cheaper Lumen, pool 3800
;   Ashline_PC_Perf     — 1080p-class, FSR3 Perf / TSR 50, RT off, pool 2200
;   Ashline_SteamDeck   — 800p / 1280x800, FSR3 Balanced / TSR 67, RT off, 60 cap
; Console: AshPCUltra / AshPCHigh / AshPCBalanced / AshPCPerf / AshDeck / AshFSR / AshTSR
; CVars documented in Docs/GRAPHICS.md and Docs/PERFORMANCE.md
