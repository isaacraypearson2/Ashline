[DeviceProfileManager]
DeviceProfileSelectionModule=DeviceProfileSelector

; Platform roots only. Named Ashline_PC_* / Ashline_SteamDeck DeviceProfiles live in
; PR #8 (cursor/movable-runtime-lights-5a13) — do not duplicate them here.
; NEVER set BaseProfileName to this section's own name (infinite loop on boot).

[Windows DeviceProfile]
DeviceType=Windows
+CVars=r.VSync=0
+CVars=r.MaxAnisotropy=16
+CVars=r.Shadow.Virtual.Enable=1
+CVars=r.Nanite=1

[WindowsEditor DeviceProfile]
DeviceType=Windows
BaseProfileName=Windows
+CVars=r.VSync=0

[Mac DeviceProfile]
DeviceType=Mac
+CVars=r.RayTracing=0
+CVars=r.MetalFX.Enabled=0

[IOS DeviceProfile]
DeviceType=IOS
+CVars=r.RayTracing=0
+CVars=r.MobileHDR=1
+CVars=r.BloomQuality=2
