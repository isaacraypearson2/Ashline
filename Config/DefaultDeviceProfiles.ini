[DeviceProfileManager]
DeviceProfileSelectionModule=DeviceProfileSelector

; -----------------------------------------------------------------------------
; Ashline device profiles (UE 5.8.2)
;
; NEVER set BaseProfileName to the same section name. Self-parenting
; ([Windows DeviceProfile] BaseProfileName=Windows) infinite-loops the
; DeviceProfileManager and can hang editor / packaged boot.
;
; Platform sections omit BaseProfileName (engine owns the root).
; Named Ashline_* profiles inherit from the platform root only.
; Runtime still applies UAshlineGraphicsSettings named presets on top.
; -----------------------------------------------------------------------------

[Windows DeviceProfile]
DeviceType=Windows
+CVars=r.VSync=0
+CVars=r.MaxAnisotropy=16
+CVars=r.Shadow.Virtual.Enable=1
+CVars=r.Nanite=1
+CVars=r.DefaultFeature.AntiAliasing=4
+CVars=r.AntiAliasingMethod=4
+CVars=r.TemporalAA.Upsampling=1

[WindowsEditor DeviceProfile]
DeviceType=Windows
BaseProfileName=Windows
+CVars=r.VSync=0

[Mac DeviceProfile]
DeviceType=Mac
+CVars=r.RayTracing=0
+CVars=r.MetalFX.Enabled=0
+CVars=r.Lumen.HardwareRayTracing=0

[IOS DeviceProfile]
DeviceType=IOS
+CVars=r.RayTracing=0
+CVars=r.MobileHDR=1
+CVars=r.BloomQuality=2
+CVars=r.Lumen.HardwareRayTracing=0

[Linux DeviceProfile]
DeviceType=Linux
+CVars=r.VSync=1
+CVars=r.MaxAnisotropy=8
+CVars=r.Shadow.Virtual.Enable=1
+CVars=r.Nanite=1
+CVars=r.RayTracing=0
+CVars=r.DefaultFeature.AntiAliasing=4

; Native SteamOS (not Proton). Proton uses Windows + Ashline_Deck at runtime.
[SteamDeck DeviceProfile]
DeviceType=Linux
BaseProfileName=Linux
+CVars=r.VSync=1
+CVars=t.MaxFPS=60
+CVars=r.ScreenPercentage=67
+CVars=r.Streaming.PoolSize=1800
+CVars=r.Streaming.LimitPoolSizeToVRAM=1
+CVars=r.RayTracing=0
+CVars=r.Lumen.HardwareRayTracing=0
+CVars=r.RayTracing.Shadows=0
+CVars=r.Shadow.Virtual.MaxQuality=1
+CVars=r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=8
+CVars=r.Lumen.ScreenProbeGather.DownsampleFactor=32
+CVars=r.Lumen.Reflections.DownsampleFactor=2
+CVars=r.MaxAnisotropy=8
+CVars=r.BloomQuality=2
+CVars=r.AmbientOcclusionLevels=1
+CVars=r.MotionBlurQuality=0
+CVars=r.DepthOfFieldQuality=0
+CVars=foliage.DensityScale=0.45
+CVars=r.ViewDistanceScale=0.7
+CVars=r.FidelityFX.FSR3.Enabled=1
+CVars=r.FidelityFX.FSR3.QualityMode=2
+CVars=r.FidelityFX.FI.Enabled=0
+CVars=r.NGX.DLSS.Enable=0

